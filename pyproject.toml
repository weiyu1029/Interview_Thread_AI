[project]
name = "careerstorymap-agent"
version = "0.1.0"
description = "CareerStoryMap Agent: an AI career concierge for evidence-based interview strategy."
authors = [{ name = "Alice Chen" }]
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.optional-dependencies]
web = [
  "streamlit>=1.50,<2",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "google-genai>=1.0,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "beautifulsoup4>=4.13,<5",
  "odfpy>=1.4,<2",
  "striprtf>=0.0.29,<1",
]
platform = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
]
lint = [
  "ruff>=0.4.6,<1.0.0",
  "ty>=0.0.1a0",
  "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B", "UP", "RUF"]
ignore = ["E501", "C901", "B006"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"platform/api/careerproof_api/main.py" = ["B008"]
"platform/api/careerproof_api/security.py" = ["B008"]

[tool.ty]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"
unknown-argument = "ignore"

[tool.codespell]
ignore-words-list = "CareerStoryMap,roadmap,FinTech,HealthTech,PropTech,InsurTech,EdTech,MarTech,AdTech,WealthTech,RevPAR,ROAS,ARR,MRR,NRR,GRR,ARPU,ARPPU,DAU,MAU"
skip = ".venv,uv.lock,artifacts/traces,artifacts/grade_results"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
