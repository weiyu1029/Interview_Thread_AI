services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: careerproof
      POSTGRES_USER: careerproof
      POSTGRES_PASSWORD: careerproof
    volumes:
      - careerproof_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerproof -d careerproof"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: platform/api/Dockerfile
    env_file: ${CAREERPROOF_ENV_FILE:-.env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_CAREERPROOF_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  careerproof_postgres:
