name: Beta feedback
description: Report a reproducible beta issue using synthetic data only.
title: "beta: "
labels: [beta-feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing InterviewThread. Do not include a real resume, job
        description, interview transcript, email address, API key, or other
        personal information. Use synthetic examples or send private feedback at
        https://interviewthreadai.com/en/contact.
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Sign-in or account
        - Resume or document import
        - Evidence Map or keyword analysis
        - Interview stories
        - Mock interview or voice
        - Job recommendations or market insights
        - Language or localization
        - Mobile or desktop interface
        - Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Describe the task and the step where the experience stopped making sense.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the exact visible error text, if any, but no personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and language
      placeholder: "Example: Safari 18, iPhone 15, Traditional Chinese"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used synthetic examples and removed personal information and secrets.
          required: true
